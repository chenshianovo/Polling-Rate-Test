plugins {
    id 'com.android.application'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'com.gamepad.rate'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gamepad.rate'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
